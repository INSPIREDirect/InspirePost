<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspire Direct Marketing - Client Journey</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,"Segoe UI",Arial,sans-serif;background:#f7f6f4;color:#444;min-height:100vh}
.page{max-width:1200px;margin:0 auto;padding:36px 40px 48px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:2.5px solid #E8601C}
.logo{height:52px;width:auto}
.doc-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#3D6B99}
.page-title{font-size:30px;font-weight:700;color:#1A3353;margin-bottom:4px}
.page-sub{font-size:14px;color:#3D6B99;margin-bottom:24px}
.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.legend{display:flex;gap:22px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:7px;font-size:13px;color:#444}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.toggle-wrap{display:flex;border-radius:8px;overflow:hidden;border:1.5px solid #1A3353}
.tog-btn{padding:8px 22px;font-size:12px;font-weight:700;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:#fff;color:#1A3353;border:none;cursor:pointer}
.tog-btn+.tog-btn{border-left:1.5px solid #1A3353}
.tog-btn.active{background:#1A3353;color:#fff}
.view{display:none}
.view.active{display:block}
.h-wrap{overflow-x:auto;padding-bottom:4px}
.h-inner{min-width:820px}
.band{display:flex;align-items:stretch;margin-bottom:3px}
.band-label{width:120px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.stages-row{display:flex;gap:3px;flex:1}
.stage-h{flex:1;padding:11px 10px 13px;border-radius:6px;cursor:pointer}
.stage-h:hover{filter:brightness(.92)}
.stage-h.sel{outline:2px solid #E8601C;outline-offset:1px}
.s-num{font-size:10px;font-weight:700;opacity:.5;margin-bottom:3px}
.s-name{font-size:12px;font-weight:600;line-height:1.3}
.s-doc{font-size:10px;margin-top:5px;opacity:.65;font-style:italic;line-height:1.3}
.conn-row{height:18px;display:flex;align-items:center;padding-left:120px;margin-bottom:3px}
.conn-label{font-size:11px;color:#999}
.v-wrap{border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.10)}
.v-table{width:100%;border-collapse:collapse}
.v-table thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:#1A3353;padding:10px 14px;text-align:left}
.v-table td{padding:10px 14px;font-size:13px;color:#444;border-bottom:1px solid rgba(0,0,0,.07);vertical-align:top;line-height:1.5}
.v-table tbody tr:last-child td{border-bottom:none}
.v-table tbody tr{cursor:pointer}
.v-table tbody tr:hover td{background:rgba(0,0,0,.03)}
.v-table tbody tr.sel td{box-shadow:inset 0 0 0 1.5px #E8601C}
td.v-num{font-weight:700;width:38px}
td.v-stage{font-weight:600;color:#1A3353;width:195px}
td.v-owner{width:115px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
td.v-doc{width:210px;font-style:italic;font-size:11px;color:#666}
.bg-sales{background:#FAE8DC}.bg-hand{background:#EEF2F7}.bg-cs{background:#E4F3EE}
.clr-sales{color:#B84A1A}.clr-hand{color:#1A3353}.clr-cs{color:#2E7D62}
.detail-panel{margin-top:18px;border-radius:8px;padding:18px 22px;background:#fff;border:2px solid #E8601C;display:none}
.detail-panel.active{display:block}
.d-header{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.d-num{font-size:32px;font-weight:700;color:#E8601C;line-height:1}
.d-title{font-size:17px;font-weight:600;color:#1A3353}
.d-band{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.d-desc{font-size:13.5px;color:#444;line-height:1.75}
.d-doc{margin-top:12px;font-size:12px;color:#B84A1A;font-style:italic;padding-top:10px;border-top:1px solid #FAE8DC}
.footer{margin-top:40px;padding-top:16px;border-top:1px solid #ddd;font-size:11px;color:#bbb;display:flex;justify-content:space-between}
</style>
</head>

<script>
var stages = [{"band": "sales", "num": 1, "name": "Researching", "desc": "Prospect identified from RFP, referral, or inbound signal. Organization researched - cause, size, data landscape, and fit for Inspire's model assessed before first contact.", "doc": ""}, {"band": "sales", "num": 2, "name": "Working Lead", "desc": "Active pursuit underway. Contact identified, outreach initiated across multiple touchpoints until a live conversation is secured.", "doc": ""}, {"band": "sales", "num": 3, "name": "Contact Made", "desc": "Live conversation established with a qualified decision-maker. The organization's interest and readiness confirmed.", "doc": ""}, {"band": "sales", "num": 4, "name": "Qualified Lead", "desc": "Lead meets Inspire's criteria for active pursuit. NDA signed before any donor data or financials are exchanged.", "doc": "Mutual NDA"}, {"band": "sales", "num": 5, "name": "Scheduled Follow-Up", "desc": "Formal follow-up booked. Donor file reviewed, callable records confirmed, and projections built per segment. Phone append quoted and authorized where file lacks coverage.", "doc": "TM Campaign Projections - Phone Append Quote"}, {"band": "sales", "num": 6, "name": "Discovery", "desc": "Deep-dive into campaign goals, segment history, internal capacity, decision process, and timeline. Billing model and program structure take shape.", "doc": ""}, {"band": "sales", "num": 7, "name": "Proposal", "desc": "Formal presentation delivered covering Inspire's model, proof points, projections, and proposed program. Pricing presented for review.", "doc": "Pitch Deck"}, {"band": "hand", "num": 8, "name": "Contract Won", "desc": "Agreement signed. Handoff is triggered. Marc introduces the CS team and sends the Client Onboarding Guide to open the transition conversation.", "doc": "Services Agreement - Client Onboarding Guide"}, {"band": "cs", "num": 9, "name": "Campaign Planning and Readiness", "desc": "CS works through the 9-section operational readiness framework with the client - covering data, script, payment, ops, SMS, dialer, compliance, training, and closeout.", "doc": "Campaign Planning and Operational Readiness Framework"}, {"band": "cs", "num": 10, "name": "Step 01 - Strategy and Creative", "desc": "Campaign direction, messaging tone, and ask matrix confirmed. Script drafted by Inspire, reviewed by client, and approved in writing before training begins.", "doc": ""}, {"band": "cs", "num": 11, "name": "Step 02 - Data and Technical", "desc": "File delivery, FTP, payment page, and CRM setup confirmed and tested. SMS work plan issued where SMS is part of the program.", "doc": "SMS Work Plan (where applicable)"}, {"band": "cs", "num": 12, "name": "Step 03 - CS and Operations", "desc": "Reporting cadence, review rhythm, distribution list, and escalation paths confirmed. Weekly meeting scheduled. CS has everything to manage the campaign from day one.", "doc": ""}, {"band": "cs", "num": 13, "name": "Agent Selection and Training", "desc": "Agents selected by campaign fit and call quality history. Client provides 2-5 slides on their organization, programs, and impact. Client rep attends training where possible.", "doc": ""}, {"band": "cs", "num": 14, "name": "Test Call and Launch", "desc": "Recorded test call reviewed and approved by Account Lead, CS Manager, and Ops Manager. Campaign goes live. First DCR delivered the following morning.", "doc": ""}];
var meta = {
  "sales":{"label":"Sales","owner":"Marc","clr":"clr-sales"},
  "hand":{"label":"Handoff","owner":"Marc + CS","clr":"clr-hand"},
  "cs":{"label":"Client Services","owner":"Carly / Alex","clr":"clr-cs"}
};
var activeNum = null;
var activeEls = [];
function pad(n){return n<10?"0"+n:""+n;}
function clearSel(){for(var i=0;i<activeEls.length;i++){activeEls[i].classList.remove("sel");}activeEls=[];}
function showDetail(s){
  var panel=document.getElementById("detail");
  if(activeNum===s.num){panel.classList.remove("active");activeNum=null;clearSel();return;}
  clearSel();
  document.getElementById("d-num").textContent=pad(s.num);
  document.getElementById("d-title").textContent=s.name;
  var bEl=document.getElementById("d-band");
  bEl.textContent=meta[s.band].owner;
  bEl.className="d-band "+meta[s.band].clr;
  document.getElementById("d-desc").textContent=s.desc;
  var dEl=document.getElementById("d-doc");
  if(s.doc){dEl.textContent="Supporting documents: "+s.doc;dEl.style.display="block";}
  else{dEl.style.display="none";}
  panel.classList.add("active");
  activeNum=s.num;
  var all=document.querySelectorAll("[data-num=\""+s.num+"\"]");
  for(var i=0;i<all.length;i++){all[i].classList.add("sel");activeEls.push(all[i]);}
}
function buildH(){
  var rows=[],cur=null;
  for(var i=0;i<stages.length;i++){
    var s=stages[i];
    if(!cur||cur.band!==s.band){cur={band:s.band,stages:[]};rows.push(cur);}
    cur.stages.push(s);
  }
  var hInner=document.getElementById("h-inner");
  for(var ri=0;ri<rows.length;ri++){
    var row=rows[ri],m=meta[row.band];
    var band=document.createElement("div");band.className="band";
    var lbl=document.createElement("div");lbl.className="band-label "+m.clr;lbl.textContent=m.label;
    band.appendChild(lbl);
    var sr=document.createElement("div");sr.className="stages-row";
    for(var si=0;si<row.stages.length;si++){
      (function(s){
        var el=document.createElement("div");
        el.className="stage-h bg-"+s.band;
        el.setAttribute("data-num",s.num);
        var h="<div class=\"s-num\">"+pad(s.num)+"</div><div class=\"s-name\">"+s.name+"</div>";
        if(s.doc)h+="<div class=\"s-doc\">"+s.doc+"</div>";
        el.innerHTML=h;
        el.onclick=function(){showDetail(s);};
        sr.appendChild(el);
      })(row.stages[si]);
    }
    band.appendChild(sr);hInner.appendChild(band);
    if(ri<rows.length-1){
      var conn=document.createElement("div");conn.className="conn-row";
      var cl=document.createElement("span");cl.className="conn-label";
      cl.textContent=row.band==="sales"?"— contract signed →":"— handoff →";
      conn.appendChild(cl);hInner.appendChild(conn);
    }
  }
}
function buildV(){
  var tbody=document.getElementById("v-body");
  for(var i=0;i<stages.length;i++){
    (function(s){
      var m=meta[s.band],tr=document.createElement("tr");
      tr.className="bg-"+s.band;tr.setAttribute("data-num",s.num);
      var desc=s.desc.length>130?s.desc.slice(0,127)+"...":s.desc;
      tr.innerHTML="<td class=\"v-num "+m.clr+"\">"+pad(s.num)+"</td>"
        +"<td class=\"v-stage\">"+s.name+"</td>"
        +"<td class=\"v-owner "+m.clr+"\">"+m.owner+"</td>"
        +"<td class=\"v-doc\">"+(s.doc||"&mdash;")+"</td>"
        +"<td>"+desc+"</td>";
      tr.onclick=function(){showDetail(s);};
      tbody.appendChild(tr);
    })(stages[i]);
  }
}
function setView(v){
  document.getElementById("view-h").classList.toggle("active",v==="h");
  document.getElementById("view-v").classList.toggle("active",v==="v");
  var btns=document.querySelectorAll(".tog-btn");
  btns[0].classList.toggle("active",v==="h");
  btns[1].classList.toggle("active",v==="v");
  document.getElementById("detail").classList.remove("active");
  activeNum=null;clearSel();
}
buildH();
buildV();
</script>
</body>
</html>
